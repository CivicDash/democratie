# =============================================================================
# Prometheus Configuration - CivicDash Monitoring
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  # Labels globaux ajoutés à toutes les métriques
  external_labels:
    monitor: 'civicdash-production'
    environment: 'production'

# Règles d'alerte (optionnel)
# rule_files:
#   - /etc/prometheus/rules/*.yml

# Configuration du scraping
scrape_configs:
  # -----------------------------------------------------------------------------
  # Prometheus lui-même
  # -----------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # -----------------------------------------------------------------------------
  # Application Laravel (FrankenPHP)
  # -----------------------------------------------------------------------------
  - job_name: 'laravel-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:80']
        labels:
          service: 'civicdash-app'
    # Si authentification requise
    # basic_auth:
    #   username: 'prometheus'
    #   password: 'secret'

  # -----------------------------------------------------------------------------
  # Redis
  # -----------------------------------------------------------------------------
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # -----------------------------------------------------------------------------
  # PostgreSQL (via PgBouncer stats)
  # -----------------------------------------------------------------------------
  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['pgbouncer-exporter:9127']
        labels:
          service: 'pgbouncer'

  # -----------------------------------------------------------------------------
  # Traefik
  # -----------------------------------------------------------------------------
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          service: 'traefik'

  # -----------------------------------------------------------------------------
  # Node Exporter (Métriques système hôte)
  # -----------------------------------------------------------------------------
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'

# Alertmanager (optionnel)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093
