;; =============================================================================
;; PgBouncer Configuration - CivicDash Production
;; =============================================================================
;;
;; PgBouncer est un pooler de connexions léger pour PostgreSQL
;; Il réduit drastiquement le nombre de connexions réelles à la BDD
;;
;; Schéma de fonctionnement :
;; ─────────────────────────
;;
;;   ┌─────────────┐   ┌─────────────┐   ┌─────────────┐
;;   │  App Node 1 │   │  App Node 2 │   │  App Node N │
;;   │ (50 workers)│   │ (50 workers)│   │ (50 workers)│
;;   └──────┬──────┘   └──────┬──────┘   └──────┬──────┘
;;          │                 │                 │
;;          │    Connexions virtuelles (1000+)  │
;;          └─────────────────┼─────────────────┘
;;                            │
;;                            ▼
;;                   ┌─────────────────┐
;;                   │    PGBOUNCER    │
;;                   │   (Port 6432)   │
;;                   │                 │
;;                   │  Pool Mode:     │
;;                   │  transaction    │
;;                   │                 │
;;                   │  Pool Size: 50  │
;;                   └────────┬────────┘
;;                            │
;;                            │  Connexions réelles (50-100)
;;                            │
;;                            ▼
;;                   ┌─────────────────┐
;;                   │   POSTGRESQL    │
;;                   │   (Port 5432)   │
;;                   └─────────────────┘
;;
;; =============================================================================

[databases]
;; Format : db_name = host=xxx port=xxx dbname=xxx
;; La variable d'environnement DATABASE_URL est automatiquement parsée
;; mais on peut aussi définir manuellement :
* = host=postgres-primary port=5432

[pgbouncer]
;; -----------------------------------------------------------------------------
;; LISTEN
;; -----------------------------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 6432

;; Socket Unix (optionnel)
;; unix_socket_dir = /var/run/pgbouncer

;; -----------------------------------------------------------------------------
;; AUTHENTIFICATION
;; -----------------------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Utilisateurs admin (peuvent voir les stats, pause/resume)
admin_users = civicdash
stats_users = civicdash,stats

;; -----------------------------------------------------------------------------
;; MODE DE POOLING
;; -----------------------------------------------------------------------------
;; session     : connexion maintenue pendant toute la session client
;; transaction : connexion retournée au pool après chaque COMMIT/ROLLBACK ✅
;; statement   : connexion retournée après chaque requête (dangereux)
;;
pool_mode = transaction

;; -----------------------------------------------------------------------------
;; LIMITES DE CONNEXIONS
;; -----------------------------------------------------------------------------
;; max_client_conn : connexions simultanées acceptées par PgBouncer
max_client_conn = 1000

;; default_pool_size : connexions réelles par couple (user, database)
default_pool_size = 50

;; min_pool_size : connexions minimum maintenues ouvertes
min_pool_size = 10

;; reserve_pool_size : connexions supplémentaires en cas de pic
reserve_pool_size = 10

;; reserve_pool_timeout : secondes avant d'utiliser le reserve pool
reserve_pool_timeout = 5

;; max_db_connections : limite totale par database (tous users confondus)
max_db_connections = 100

;; max_user_connections : limite totale par user (toutes databases)
max_user_connections = 100

;; -----------------------------------------------------------------------------
;; TIMEOUTS
;; -----------------------------------------------------------------------------
;; Timeout pour les requêtes (0 = illimité, géré par PostgreSQL)
query_timeout = 0

;; Timeout pour l'attente d'une connexion libre
query_wait_timeout = 120

;; Fermer les clients inactifs après N secondes
client_idle_timeout = 600

;; Timeout de connexion au serveur PostgreSQL
server_connect_timeout = 15

;; Timeout de login au serveur
server_login_retry = 15

;; Fermer les connexions serveur inutilisées après N secondes
server_idle_timeout = 600

;; Durée de vie maximum d'une connexion serveur
server_lifetime = 3600

;; -----------------------------------------------------------------------------
;; RESET DES CONNEXIONS
;; -----------------------------------------------------------------------------
;; Requête exécutée après retour de connexion au pool
;; DISCARD ALL réinitialise tous les états de session
server_reset_query = DISCARD ALL

;; Requête de vérification de santé
server_check_query = SELECT 1

;; Délai entre vérifications de santé (secondes)
server_check_delay = 30

;; -----------------------------------------------------------------------------
;; PARAMÈTRES STARTUP (Laravel/PDO spécifique)
;; -----------------------------------------------------------------------------
;; Ignorer certains paramètres que PDO envoie mais qui ne sont pas supportés
;; en mode transaction
ignore_startup_parameters = extra_float_digits,geqo

;; -----------------------------------------------------------------------------
;; SÉCURITÉ TLS (optionnel)
;; -----------------------------------------------------------------------------
;; client_tls_sslmode = prefer
;; client_tls_key_file = /etc/pgbouncer/pgbouncer.key
;; client_tls_cert_file = /etc/pgbouncer/pgbouncer.crt

;; server_tls_sslmode = prefer
;; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

;; -----------------------------------------------------------------------------
;; LOGGING
;; -----------------------------------------------------------------------------
;; Niveau de log : debug, info, notice, warning, error
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Statistiques
stats_period = 60

;; Fichiers de log
;; logfile = /var/log/pgbouncer/pgbouncer.log
;; pidfile = /var/run/pgbouncer/pgbouncer.pid

;; -----------------------------------------------------------------------------
;; DNS
;; -----------------------------------------------------------------------------
;; Résolution DNS au démarrage uniquement (plus performant)
dns_max_ttl = 15
dns_nxdomain_ttl = 15

;; -----------------------------------------------------------------------------
;; LIMITES SYSTÈME
;; -----------------------------------------------------------------------------
;; Nombre maximum de descripteurs de fichiers
;; max_client_conn + max_db_connections + reserve
;; Géré automatiquement par Docker
