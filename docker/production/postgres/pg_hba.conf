# =============================================================================
# PostgreSQL Host-Based Authentication (pg_hba.conf)
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (Unix socket)
local   all             all                                     scram-sha-256

# IPv4 local connections (Docker network)
host    all             all             127.0.0.1/32            scram-sha-256

# Docker network (civicdash_production: 172.28.0.0/16)
host    all             all             172.28.0.0/16           scram-sha-256

# PgBouncer connection
host    all             all             pgbouncer               scram-sha-256

# Replication connections (pour futur replica)
host    replication     all             172.28.0.0/16           scram-sha-256

# Reject all other connections
host    all             all             0.0.0.0/0               reject
