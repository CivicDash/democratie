services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: civicdash-app:latest
    container_name: civicdash_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE:-civicdash}
      - DB_USERNAME=${DB_USERNAME:-civicdash}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      - SERVER_NAME=:8000
      - FRANKENPHP_CONFIG=worker ./public/frankenphp-worker.php
    ports:
      - "8080:8000"
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  horizon:
    image: civicdash-app:latest
    container_name: civicdash_horizon
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    entrypoint: ["php", "artisan", "horizon"]
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE:-civicdash}
      - DB_USERNAME=${DB_USERNAME:-civicdash}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - civicdash

  postgres:
    image: postgres:15-alpine
    container_name: civicdash_db
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${DB_DATABASE:-civicdash}
      POSTGRES_USER: ${DB_USERNAME:-civicdash}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5433:5432"
    networks:
      - civicdash
      - civicdash_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-civicdash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: '2g'

  redis:
    image: redis:alpine
    container_name: civicdash_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: civicdash_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_NO_ANALYTICS: true
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: civicdash_mail
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH: ${MAILPIT_AUTH:-}
    volumes:
      - mailpit_data:/data
    networks:
      - civicdash

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  mailpit_data:
    driver: local

networks:
  civicdash:
    driver: bridge
  civicdash_shared:
    external: true
  mailu_default:
    external: true
