# CivicDash Redis Configuration
# Standalone master - no replication

# Disable replication explicitly
# replicaof <no one>

# Persistence
save 3600 1
save 300 100
save 60 10000

# Memory
maxmemory-policy allkeys-lru

# Security - bind to all interfaces inside Docker network
bind 0.0.0.0
protected-mode no

# Logging
loglevel notice
