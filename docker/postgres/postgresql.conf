# Reseau
listen_addresses = '*'
# PostgreSQL 15 - Partage dev+prod, 31 GB RAM, SSD, 8 cores

# Memoire (reduit pour cohabitation 2 envs)
shared_buffers = 4GB
work_mem = 32MB
maintenance_work_mem = 256MB
effective_cache_size = 12GB
huge_pages = try

# WAL / Ecriture
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# Planificateur (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# Parallelisme (8 cores)
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Connexions (2 envs: dev + prod)
max_connections = 200

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on

# Stats
track_activities = on
track_counts = on
track_io_timing = on
