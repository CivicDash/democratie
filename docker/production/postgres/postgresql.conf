# =============================================================================
# PostgreSQL 15 - Configuration Production Optimisée
# =============================================================================
# Serveur cible : 4-8 vCPU, 8-32 GB RAM
# Calculé pour ~8 GB RAM dédié à PostgreSQL
# =============================================================================

# -----------------------------------------------------------------------------
# CONNEXIONS
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200                    # PgBouncer gère les connexions clients

# Authentification
password_encryption = scram-sha-256

# -----------------------------------------------------------------------------
# MÉMOIRE
# -----------------------------------------------------------------------------
# shared_buffers : ~25% de la RAM totale dédiée à PostgreSQL
shared_buffers = 2GB

# effective_cache_size : ~75% de la RAM (PostgreSQL + OS cache)
effective_cache_size = 6GB

# work_mem : mémoire par opération de tri/hash
# Formule : (RAM - shared_buffers) / (max_connections * 3)
work_mem = 32MB

# maintenance_work_mem : pour VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 512MB

# Huge pages (si supporté par le système)
huge_pages = try

# -----------------------------------------------------------------------------
# WAL (Write-Ahead Logging)
# -----------------------------------------------------------------------------
wal_level = replica                      # Prêt pour réplication
max_wal_size = 2GB
min_wal_size = 256MB
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Compression WAL
wal_compression = on

# -----------------------------------------------------------------------------
# REPLICATION (Préparation pour VM dédiée)
# -----------------------------------------------------------------------------
max_wal_senders = 5                      # Nombre de replicas possibles
max_replication_slots = 5
wal_keep_size = 1GB

# Hot Standby
hot_standby = on
hot_standby_feedback = on

# Synchronous Commit
synchronous_commit = on                  # Durabilité garantie

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------
random_page_cost = 1.1                   # SSD (1.1) vs HDD (4.0)
effective_io_concurrency = 200           # SSD (200) vs HDD (2)
default_statistics_target = 100

# Parallélisme
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# JIT Compilation
jit = on
jit_above_cost = 100000

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Quoi logger
log_min_duration_statement = 1000        # Requêtes > 1 seconde
log_checkpoints = on
log_connections = off                    # Trop verbeux avec PgBouncer
log_disconnections = off
log_lock_waits = on
log_temp_files = 0                       # Log tous les fichiers temp

# Format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'                    # Log les DDL (CREATE, ALTER, DROP)

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000

# -----------------------------------------------------------------------------
# SÉCURITÉ
# -----------------------------------------------------------------------------
# SSL (à activer si certificats disponibles)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Timeout
statement_timeout = 60000                # 60 secondes max par requête
idle_in_transaction_session_timeout = 300000  # 5 minutes

# -----------------------------------------------------------------------------
# PERFORMANCE ADDITIONNELLE
# -----------------------------------------------------------------------------
# Prefetch (pour les index scans séquentiels)
effective_io_concurrency = 200

# Buffer pour les requêtes temporaires
temp_buffers = 32MB

# Statistiques avancées
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Extensions
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements pour analyse des requêtes
pg_stat_statements.max = 10000
pg_stat_statements.track = all
