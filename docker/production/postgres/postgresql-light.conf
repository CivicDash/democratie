# =============================================================================
# PostgreSQL 15 - Configuration LIGHT (Serveur Limité)
# =============================================================================
# Optimisé pour : 8 vCPU, 8 GB RAM dédié à PostgreSQL
# Focus : Économie d'espace disque + performances correctes
# =============================================================================

# -----------------------------------------------------------------------------
# CONNEXIONS
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100                    # Réduit (pas de PgBouncer)

# -----------------------------------------------------------------------------
# MÉMOIRE
# -----------------------------------------------------------------------------
shared_buffers = 2GB                     # ~25% de la RAM
effective_cache_size = 6GB               # ~75% de la RAM
work_mem = 32MB
maintenance_work_mem = 256MB             # Réduit

# -----------------------------------------------------------------------------
# WAL - ÉCONOMIE DISQUE
# -----------------------------------------------------------------------------
wal_level = minimal                      # Pas de réplication = moins de WAL
max_wal_size = 1GB                       # Réduit
min_wal_size = 128MB
wal_buffers = 32MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min               # Plus fréquent = moins de WAL

# Compression WAL
wal_compression = on

# Pas de réplication (économie disque)
max_wal_senders = 0
wal_keep_size = 0

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------
random_page_cost = 1.1                   # SSD
effective_io_concurrency = 200
default_statistics_target = 100

# Parallélisme (réduit pour économiser RAM)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# JIT désactivé (économie RAM)
jit = off

# -----------------------------------------------------------------------------
# LOGGING - MINIMAL
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'       # Un fichier par jour de la semaine
log_rotation_age = 1d
log_rotation_size = 50MB                 # Taille max par fichier
log_truncate_on_rotation = on            # Réutiliser les fichiers

# Quoi logger (minimal)
log_min_duration_statement = 5000        # Requêtes > 5 secondes seulement
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10240                   # Log si > 10MB

# Format compact
log_line_prefix = '%t [%p]: '
log_statement = 'none'                   # Pas de log des requêtes

# -----------------------------------------------------------------------------
# AUTOVACUUM - ÉCONOMIE DISQUE
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2               # Réduit
autovacuum_naptime = 5min                # Moins fréquent
autovacuum_vacuum_threshold = 100
autovacuum_vacuum_scale_factor = 0.2     # Plus tolérant
autovacuum_analyze_threshold = 100
autovacuum_analyze_scale_factor = 0.1

# Vacuum plus agressif pour récupérer l'espace
autovacuum_vacuum_cost_limit = 500

# -----------------------------------------------------------------------------
# TIMEOUTS
# -----------------------------------------------------------------------------
statement_timeout = 120000               # 2 minutes max
idle_in_transaction_session_timeout = 60000  # 1 minute

# -----------------------------------------------------------------------------
# STATISTIQUES
# -----------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = off                    # Désactivé (overhead)
track_functions = none                   # Désactivé (overhead)
