name: Tests

on:
  # Un garde-fou qui ne tourne que sur dev et main ne protège pas le travail : les
  # défauts arrivent par les branches de travail, où rien ne s'exécutait.
  push:
    branches: ['**']
  pull_request:

jobs:
  # Échec rapide (~30 s) avant la suite complète : ces deux contrôles attrapent la
  # famille de défauts qui a motivé l'audit — une écriture validée sur une colonne
  # qui n'existe pas, un composant Vue rendu mais absent.
  garde-fous:
    name: Garde-fous back-office
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: civicdash
          POSTGRES_PASSWORD: password
          POSTGRES_DB: civicdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, pcntl, intl

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Garde-fous
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: civicdash_test
          DB_USERNAME: civicdash
          DB_PASSWORD: password
        run: php artisan test tests/Feature/Guardrails --stop-on-failure

  tests:
    name: PHP ${{ matrix.php }} - Laravel Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: civicdash
          POSTGRES_PASSWORD: password
          POSTGRES_DB: civicdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, pcntl, intl
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create test database schema
        run: php artisan migrate --force --seed
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: civicdash_test
          DB_USERNAME: civicdash
          DB_PASSWORD: password
          REDIS_HOST: localhost
          CACHE_DRIVER: array

      - name: Run tests with coverage
        run: php artisan test --coverage --min=30
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: civicdash_test
          DB_USERNAME: civicdash
          DB_PASSWORD: password
          REDIS_HOST: localhost
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test app routes config
