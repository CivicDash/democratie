# =============================================================================
# CivicDash - Déploiement automatisé sur Proxmox
# =============================================================================
# Ce workflow :
# 1. Build l'image Docker de l'application
# 2. Push vers GitHub Container Registry
# 3. Déclenche la mise à jour du container Proxmox via API
# =============================================================================

name: Deploy to Proxmox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Build et push de l'image Docker
  # ===========================================================================
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  # ===========================================================================
  # Déploiement sur Proxmox
  # ===========================================================================
  deploy-proxmox:
    name: 🚀 Deploy to Proxmox
    runs-on: ubuntu-latest
    needs: build-and-push
    
    environment:
      name: production
      url: https://objectif2027.fr
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: 📋 Create tfvars from secrets
        run: |
          cat > infrastructure/terraform/terraform.tfvars << EOF
          proxmox_api_url   = "${{ secrets.PROXMOX_API_URL }}"
          proxmox_api_token = "${{ secrets.PROXMOX_API_TOKEN }}"
          proxmox_node      = "${{ secrets.PROXMOX_NODE }}"
          domain            = "${{ secrets.DOMAIN }}"
          public_ip         = "${{ secrets.PUBLIC_IP }}"
          ssh_public_key    = "${{ secrets.SSH_PUBLIC_KEY }}"
          app_version       = "${{ needs.build-and-push.outputs.version }}"
          db_password       = "${{ secrets.DB_PASSWORD }}"
          redis_password    = "${{ secrets.REDIS_PASSWORD }}"
          meili_master_key  = "${{ secrets.MEILI_MASTER_KEY }}"
          app_key           = "${{ secrets.APP_KEY }}"
          EOF

      - name: 🔄 Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: 📝 Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan -out=tfplan

      - name: 🚀 Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: 🔄 Restart Application Container
        run: |
          # Appel direct à l'API Proxmox pour redémarrer le container
          curl -s -k \
            -H "Authorization: PVEAPIToken=${{ secrets.PROXMOX_API_TOKEN }}" \
            -X POST \
            "${{ secrets.PROXMOX_API_URL }}/nodes/${{ secrets.PROXMOX_NODE }}/lxc/101/status/reboot"

      - name: ⏳ Wait for application
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # Vérifier que l'application répond
          for i in {1..10}; do
            if curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DOMAIN }}/health" | grep -q "200"; then
              echo "✅ Application is up!"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 10
          done
          
          echo "❌ Application did not respond in time"
          exit 1

      - name: 📢 Notify deployment
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"
          echo "URL: https://${{ secrets.DOMAIN }}"

  # ===========================================================================
  # Rollback en cas d'échec
  # ===========================================================================
  rollback:
    name: ⏪ Rollback on failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-proxmox]
    if: failure()
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⏪ Restore previous version
        run: |
          echo "⚠️ Deployment failed - initiating rollback..."
          
          # Récupérer la version précédente depuis les tags
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "latest")
          
          echo "Rolling back to: $PREVIOUS_TAG"
          
          # Mettre à jour le container avec l'ancienne version
          curl -s -k \
            -H "Authorization: PVEAPIToken=${{ secrets.PROXMOX_API_TOKEN }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -X PUT \
            -d "ostemplate=docker://ghcr.io/${{ github.repository }}:${PREVIOUS_TAG}" \
            "${{ secrets.PROXMOX_API_URL }}/nodes/${{ secrets.PROXMOX_NODE }}/lxc/101/config"
          
          # Redémarrer
          curl -s -k \
            -H "Authorization: PVEAPIToken=${{ secrets.PROXMOX_API_TOKEN }}" \
            -X POST \
            "${{ secrets.PROXMOX_API_URL }}/nodes/${{ secrets.PROXMOX_NODE }}/lxc/101/status/reboot"

      - name: 📢 Notify rollback
        run: |
          echo "⚠️ Rollback completed"
          echo "Please investigate the deployment failure"
