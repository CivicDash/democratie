# Nginx reverse proxy pour Mailu
# À ajouter dans /etc/nginx/sites-available/mail.civis-consilium.eu

server {
    listen 80;
    listen [::]:80;
    server_name mail.civis-consilium.eu;

    # Redirection HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.civis-consilium.eu;

    # Certificats SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mail.civis-consilium.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.civis-consilium.eu/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Logs
    access_log /var/log/nginx/mail.civis-consilium.eu.access.log;
    error_log /var/log/nginx/mail.civis-consilium.eu.error.log;

    # Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Webmail (Roundcube)
    location / {
        proxy_pass http://127.0.0.1:8180;
    }

    # Admin Mailu
    location /admin {
        proxy_pass http://127.0.0.1:8180;
    }

    # Static files
    location /static {
        proxy_pass http://127.0.0.1:8180;
    }

    # Websocket support (pour certaines fonctionnalités)
    location /socket.io {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
