# =============================================================================
# CivicDash - Docker Compose avec FrankenPHP + PHP 8.5
# =============================================================================
# Usage:
#   docker compose -f docker-compose.frankenphp.yml up -d
#   docker compose -f docker-compose.frankenphp.yml logs -f app
# =============================================================================

services:
  # =========================================================================
  # Application FrankenPHP (remplace Nginx + PHP-FPM)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.frankenphp
    container_name: civicdash_app
    restart: unless-stopped
    ports:
      - "8080:80"    # HTTP
      - "8443:443"   # HTTPS
      - "8443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-civicdash}
      - DB_USERNAME=${DB_USERNAME:-civicdash}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      - SCOUT_DRIVER=meilisearch
      - SCOUT_QUEUE=false
      - OCTANE_SERVER=frankenphp
      - SERVER_NAME=:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: civicdash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-civicdash}
      POSTGRES_USER: ${DB_USERNAME:-civicdash}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - civicdash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-civicdash} -d ${DB_DATABASE:-civicdash}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis Cache & Queue
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: civicdash_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Meilisearch (Full-text Search)
  # =========================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: civicdash_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_NO_ANALYTICS: true
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 2Gi
      MEILI_MAX_INDEXING_THREADS: 4
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # =========================================================================
  # Queue Worker (Horizon-compatible)
  # =========================================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile.frankenphp
    container_name: civicdash_queue
    restart: unless-stopped
    working_dir: /app
    command: php artisan horizon
    volumes:
      - ./:/app
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-civicdash}
      - DB_USERNAME=${DB_USERNAME:-civicdash}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - civicdash
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================================================
  # Scheduler (Laravel Cron)
  # =========================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.frankenphp
    container_name: civicdash_scheduler
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./:/app
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-civicdash}
      - DB_USERNAME=${DB_USERNAME:-civicdash}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - civicdash

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# =============================================================================
# Réseau
# =============================================================================
networks:
  civicdash:
    driver: bridge
